<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"/>
      <link rel="stylesheet" href="icon/remixicon.css">
    <style>
      *,
      *::before,
      *::after {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 80vh;
        /* background: rgb(252, 249, 249); */
         font-family: "Space Grotesk", sans-serif;
        background:
          radial-gradient(circle at 20% 20%, #d9d2ff, transparent 35%),
          radial-gradient(circle at 80% 80%, #c9f5ff, transparent 35%), #ffffff;
      }
      .header {
        width: 100%;
        min-height: 100px;
        height: auto;
        display: flex;
        justify-content: space-between;
        /* margin-top: 50px; */
        border-bottom: 1px solid black;

        > .logo {
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          /* width: 50%; */
          height: 100px;
          font-size: 38px;
          text-transform: uppercase;
          color: black;
          margin-left: 100px;
          transform-style: preserve-3d;
          transform-origin: center;
          perspective: 500px;
          transition: 1s;

          &:hover {
            transform: perspective(500px) rotateY(360deg);
            color: rgb(163, 161, 161);
          }
        }
        > .nav {
          /* width: 50%; */
          height: 100px;
          display: flex;
          justify-content: space-between;
          align-items: flex-end;
          margin-right: 100px;
          gap: 40px;

          > a {
            list-style: none;
            color: black;
            font-size: 20px;
            text-decoration: none;
            &:hover {
              color: rgb(163, 161, 161);
            }
          }
        }
      }
      .main {
        width: 100%;
        min-height: 100vh;
       
        height: auto;
        padding: 70px 7%;
        display: flex;
        align-items: center;
        > .text {
          /* border: 1px solid black; */
          width: 20%;
          height: 500px;
        
          > h1 {
             
            font-size: 70px;
            > span {
              color: rgb(163, 161, 161);
            }
          }
          > p {
            color: rgb(163, 161, 161);
            font-size: 14px;
          }
          > .text2 {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
            > span {
              display: block;
              width: 40px;
              height: 1px;
              /* border: 1px solid rgb(100, 100, 100); */
              flex-shrink: 0;
            }
            > p {
              font-size: 14px;
              color: rgb(163, 161, 161);
            }
          }
        }
        >.card{
            width: 70%;
            min-height: 600px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            perspective: 1200px;
            >div{
                width: 300px;
                height: 420px;
                position: absolute;               
                /* border: 1px solid rgb(12, 4, 4); */
                transform-style: preserve-3d;
                transition: 2s;
                cursor: pointer;
                transform-origin: center;
                &:nth-of-type(1){
                  transform:
                  translateX(-120px)
                  rotateY(12deg)
                  translateZ(0);
                }
                &:nth-of-type(2){
                     transform:
                     translateX(0)
                     rotateY(0deg)
                     translateZ(80px);
                }
                &:nth-of-type(3){
                    transform:
                    translateX(120px)
                    rotateY(-12deg)
                    translateZ(0);
                }
                &:hover{
                     width: 360px;
                     height: 480px;

                     transform:
                         translateX(-350px)
                         translateZ(400px);

                       z-index: 20;
                }
                
                >img{
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    display: block;
                }

            }

        }
        
      }
      .main2{
            width: 100%;
            min-height: 80vh;
            height: auto;
            display: flex;
            /* background-color: aqua; */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            >h2{
                text-align: center;
                font-size: 42px;
                margin-top: 40px;
                display: block;
            }
           >figure{
            width: 450px;
             height: 450px;
             display: flex;
             justify-content: center;
             align-items: center;
             margin-top: 30px;
             position: relative;
             transform-style: preserve-3d;
             cursor: pointer;
             perspective: 1200px;
               >img{
             width: 100%;
             height: 100%;
            object-fit: cover;
            border-radius: 10px;
            transition: 0.8s;
            display: block;
           
            
            }
             >.overlay{
                opacity: 1;
                inset: 0;
                background-color:rgba(0, 0, 0, 0.329) ;
                backdrop-filter: blur(4px);
                position: absolute;
                border-radius: 10px;
                z-index: 2;
               
            }
             &:hover{
                    >.overlay{
                        opacity: 0;
                    }
                    >img{
                        transform: perspective(800px) translateZ(100px) rotate(0deg) scale(1.05);
                    }
                }
           }
           >.icon{            
            display: flex;           
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            gap: 50px;
            >i{
             font-size: 35px;
            color: rgb(2, 29, 29);
            cursor: pointer;
            transition: 0.4s;
            &:hover{
                transform: translateY(-8px);
                color: rgb(12, 75, 75);
            }
            }
           }
           >h5{
            margin-top: 100px;
            margin-bottom: 30px;
            text-align: center;
           }


        }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="logo">ZAHRA</div>
      <nav class="nav">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>
    <main class="main" id="home">
      <section class="text">
        <h1>
          3D Layered
          <span>Cards.</span>
        </h1>
        <p>
          A minimal experiment using CSS transforms to create depth without
          JavaScript.
        </p>
        <div class="text2">
          <span></span>
          Hover to explore
        </div>
      </section>
      <section class="card">
       <div>
        <img src="img/003.jpg" alt="">
       </div>
        <div>
        <img src="img/002.jpg" alt="">
       </div>
        <div>
        <img src="img/001.jpg" alt="">
       </div>

      </section>
    </main>
    <section class="main2">
        <h2>zahra gharezade</h2>
        
        <figure>
            
            <img src="img/005.png" alt="">
            <div class="overlay"></div>
        </figure>
        <div class="icon">
         <i class="ri-instagram-line"></i>
        <i class="ri-github-fill"></i>
        <i class="ri-linkedin-box-fill"></i>
        </div>
        
        <h5>@ Lorem ipsum dolor sit amet consectetur adipisicing elit. Debitis sapiente magnam eveniet expedita ratione rerum.

        </h5>
       
    </section>
  </body>
</html>
